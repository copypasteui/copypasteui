name: Release MCP package

# Publishes the copypasteui.dev npm package when a tag like mcp-v0.1.1 is pushed. npm trusted publishing: GitHub proves
# to npm that this workflow is publishing, so there is no token to store or leak. npm stages the version; a maintainer
# approves it on npmjs.com with two-factor authentication before it goes live.
on:
  push:
    tags: ["mcp-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: npm with trusted publishing (11.5.1 or later)
        run: npm install -g npm@11.21.0
      - run: npm ci
      - name: Check the tag matches packages/mcp/package.json
        run: test "mcp-v$(node -p "require('./packages/mcp/package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run registry:build
      - run: npm test
      # Staged, not published: npm only lets this workflow stage a version, which goes live once approved on npmjs.com.
      - run: npm stage publish -w packages/mcp --provenance --access public
