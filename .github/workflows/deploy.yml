name: Deploy site

# CI calls this after its checks and CodeQL pass on main, handing over the site it built and checked, and publishes it
# to Cloudflare (Workers static assets, configured in wrangler.jsonc). Run it by hand (Actions → Deploy site → Run
# workflow) to rebuild and redeploy without a push. Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: true
    environment:
      name: production
      url: https://copypasteui.dev
    env:
      COPYPASTEUI_SITE_URL: ${{ vars.COPYPASTEUI_SITE_URL || 'https://copypasteui.dev' }}
      NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
      NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Preview images aren't part of the site: they're links to cdn.copypasteui.dev (or a contributor's host).
      - name: Use the site CI built and checked
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: apps/web/out
      - name: Build the site (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm ci
          npm run build
      - name: Publish to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.148.0 deploy
