name: Deploy site

# CI calls this after its checks and CodeQL pass on main, handing over the site it built and checked. Run it by hand
# (Actions → Deploy site → Run workflow) to rebuild and redeploy without a push.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COPYPASTEUI_SITE_URL: ${{ vars.COPYPASTEUI_SITE_URL || 'https://copypasteui.dev' }}
      NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
      NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use the site CI built and checked (thumbnails and OG banners included)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: apps/web/out
      - run: npx playwright@1.54.1 install --with-deps chromium
      - name: Build the site, thumbnails and OG banners (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm run build
          npm run screenshots
      - name: Record the looping card previews
        run: npm run previews
      - name: Remove build-only pages (og render pages)
        run: npm run prune
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
