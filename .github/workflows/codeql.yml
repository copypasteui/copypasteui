name: CodeQL

# Called by CI on every push and pull request (so the deploy waits for it), and run weekly for newly published queries.
on:
  workflow_call:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  # Code scanning on a private repository needs GitHub Code Security (a paid add-on), so the scan only runs once
  # the repository is public. Asked of the API rather than read from the event, because scheduled runs don't carry it.
  visibility:
    runs-on: ubuntu-latest
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "public=$(gh api "repos/${{ github.repository }}" --jq '(.private | not)')" >> "$GITHUB_OUTPUT"

  analyze:
    needs: visibility
    if: needs.visibility.outputs.public == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The CodeQL action reads its own workflow run.
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
